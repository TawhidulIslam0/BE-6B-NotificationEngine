services:
  postgres-test:
    image: postgres:15
    container_name: notification-engine-postgres-test
    environment:
      POSTGRES_DB: notification_engine_test
      POSTGRES_USER: notification_test
      POSTGRES_PASSWORD: notification_test
    ports:
      - "15433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U notification_test -d notification_engine_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7
    container_name: notification-engine-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-test:
    image: confluentinc/cp-kafka:7.8.0
    container_name: notification-engine-kafka-test
    ports:
      - "29094:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka-test:29092,CONTROLLER://kafka-test:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server kafka-test:29092 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  rabbitmq-test:
    image: rabbitmq:3.12-management
    container_name: notification-engine-rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: notification-engine-test
    working_dir: /app
    environment:
      NODE_ENV: test
      TZ: America/New_York
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: notification_engine_test
      POSTGRES_USER: notification_test
      POSTGRES_PASSWORD: notification_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka-test:29092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-test:5672
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
    command: sh -c "npm run db:migrate && rm -rf dist && npm test"